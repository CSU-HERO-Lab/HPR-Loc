# ZInD semantic one-hot model reported in the paper.
project_name: "hpr-loc"
run_name: "hpr_zind_semantic_diffusion"
use_wandb: true
seed: 42
gpu_ids: [0]
epochs: 60
batch_size: 8
val_batch_size: 4
num_workers: 4
log_every_n_steps: 10
precision: "32-true"
gradient_clip_val: 1.0
num_sanity_val_steps: 1

dptv2_ckpt_path: "checkpoints/depth_anything_v2_vits.pth"
image_encoder: "vits"
freeze_image_backbone: true
image_token_grid: [6, 40]
diffusion_feature_dim: 128
diffusion_map_feature_dim: 64
diffusion_map_input_mode: "semantic_onehot"
diffusion_map_context_blocks: 2
diffusion_map_pretrained: false
diffusion_image_layers: 1
diffusion_denoiser_layers: 2
diffusion_num_heads: 4
diffusion_dropout: 0.1
diffusion_pose_fourier_bands: 4
diffusion_coordinate_convention: "metric_cell_center_v1"
diffusion_metric_relative_max_m: 20.0
diffusion_metric_relative_scale_m: 5.0

diffusion_train_steps: 1000
diffusion_train_particles: 8
diffusion_val_particles: 64
diffusion_sample_steps: 10
diffusion_theta_loss_weight: 1.0
diffusion_mode_sigma_m: 0.75
diffusion_mode_sigma_deg: 20.0

lr: 1.0e-4
min_lr: 1.0e-5
weight_decay: 1.0e-4

datasets:
  dataset_type: "zind"
  map_res: 0.01
  data_folder: "datasets_zind/disco_floc"
  map_data_folder: "datasets_zind/processed"
  data_splits: "datasets_zind/disco_floc/split.yaml"
  val_split: "val"
  val_subset_fraction: 0.1
  val_subset_seed: 42
  floorplan_img_size: [256, 256]
  floorplan_representation: "semantic_onehot"
  map_file: "floorplan_semantic.png"
  local_map_crop_size_meters: 5.0
  map_pose_rot_aug:
    enable: true
    p: 0.5
    angles: [90, 180, 270]
  hard_negative:
    mode: "none"
  pose_aug:
    enable: false

checkpoint_dir: "checkpoints/hpr_zind_semantic/diffusion"
